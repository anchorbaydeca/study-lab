<script>
(()=>{
const DAY=864e5, OLDKEY='abdeca-study-v1', PKEY='abdeca-study-profile', KEY_PREFIX='abdeca-study-v2';
const CLUSTERS=[['marketing','Marketing'],['finance','Finance'],['hospitality','Hospitality & Tourism'],['bma','Business Management & Administration'],['entrepreneurship','Entrepreneurship'],['pfl','Personal Financial Literacy'],['bacore','Principles events (BA Core)']];
const cname=k=>(CLUSTERS.find(c=>c[0]===k)||[k,k])[1];
const EMAIL_RE=/^[a-z0-9._-]+@(absstudents\.abs\.misd\.net|abs\.misd\.net)$/i;
const EXAM=new Date('2026-12-01T08:30:00'), BENCH=[{d:new Date('2026-11-11T23:59:00'),p:65},{d:new Date('2026-11-25T23:59:00'),p:80}];
const FIRST_PASS=new Date('2026-11-24T23:59:00');
const app=document.getElementById('app');
let DATA=null, S=null, P=null, storageOK=true, session=null, KEY='';

/* ---------- storage ----------
   Each student's progress is kept on this device (localStorage) and in their Study Lab
   account (Cloud Firestore, through cloud.js). Records are keyed by the student's scrambled ID. */
const SKEY='abdeca-study-v3';
function blank(){return{v:3,boost:{},name:'',cards:{},log:[],days:{},exams:[],mode:'q',newToday:{d:'',n:0},reports:[],bank:null,upd:0}}
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(PKEY))||{};return p.v===3?{v:3,users:p.users||{},cur:p.cur||''}:{v:3,users:{},cur:''}}catch(e){storageOK=false;return{v:3,users:{},cur:''}}}
function saveProfile(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){storageOK=false}}
const me=()=>P.users[P.cur];
const who=()=>me()&&me().email?me().email.split('@')[0]:'Signed in';
function keyFor(sid,cl){return SKEY+':'+sid+':'+cl}
function readLocal(k){try{const r=localStorage.getItem(k);return r?Object.assign(blank(),JSON.parse(r)):null}catch(e){storageOK=false;return null}}
function localSave(){if(!KEY)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
function save(){if(!KEY)return;S.upd=Date.now();localSave();markDirty()}
// Same scrambled ID as cloud.js (keep SALT in step with it).
async function sidFor(email){const b=new TextEncoder().encode('abdeca-study-lab|'+String(email).trim().toLowerCase()),h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20)}

/* ---------- dates ---------- */
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const today=()=>sod(Date.now());
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const daysTo=d=>Math.max(0,Math.ceil((sod(d)-today())/DAY));
const fmt=d=>new Date(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

/* ---------- merging two copies of a student's progress ----------
   Used when this device and the account (or two devices) both have answers. Keeps every
   answer from both, the most recent state of each card, and every practice exam. */
const cstamp=c=>Math.max(c.seen||0,c.last||0,c.lok||0,c.lmiss||0);
const dkeyT=k=>{if(!k)return 0;const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
function mergeS(a,b){
  if(!b)return a; if(!a)return Object.assign(blank(),b);
  a=Object.assign(blank(),a); b=Object.assign(blank(),b);
  const has=x=>Object.keys(x.cards).length||x.exams.length;
  if(!has(b))return a; if(!has(a))return b;
  const m=Object.assign(blank(),(b.upd||0)>(a.upd||0)?b:a);
  m.cards={}; for(const id of new Set(Object.keys(a.cards).concat(Object.keys(b.cards)))){const x=a.cards[id],y=b.cards[id]; m.cards[id]=!x?y:!y?x:cstamp(y)>cstamp(x)?y:x}
  const seenK=new Set(); m.log=a.log.concat(b.log).filter(e=>{const k=e.id+'|'+e.at; if(seenK.has(k))return false; seenK.add(k); return true}).sort((x,y)=>x.at-y.at).slice(-2000);
  m.days={}; for(const k of new Set(Object.keys(a.days).concat(Object.keys(b.days))))m.days[k]=Math.max(a.days[k]||0,b.days[k]||0);
  const cnt={}; for(const e of m.log)cnt[dkey(e.at)]=(cnt[dkey(e.at)]||0)+1; for(const k in cnt)m.days[k]=Math.max(m.days[k]||0,cnt[k]);
  const ex={}; for(const e of a.exams.concat(b.exams))ex[e.at]=e; m.exams=Object.values(ex).sort((x,y)=>x.at-y.at);
  m.reports=[...new Set(a.reports.concat(b.reports))].sort((x,y)=>x-y);
  m.boost=Object.assign({},b.boost||{},a.boost||{});
  const p=a.newToday||{d:'',n:0},q=b.newToday||{d:'',n:0}; m.newToday=p.d===q.d?{d:p.d,n:Math.max(p.n,q.n)}:dkeyT(q.d)>dkeyT(p.d)?q:p;
  m.v=3; m.upd=Math.max(a.upd||0,b.upd||0); return m}
const richer=(m,r)=>!r||m.log.length>r.log.length||m.exams.length>r.exams.length||Object.keys(m.cards).length>Object.keys(r.cards).length;

/* ---------- account sync ----------
   Answers save on this device at once and reach the account a few seconds later (sooner after
   10 answers, at the end of a session and when the page is hidden). Each save merges with what
   the account already has, so a phone and a school computer never overwrite each other. */
let CLOUD=null, MODE='cloud', dirty=0, pushT=null, syncing=null, lastSync=0, syncErr='', ADV=false, DATAKEY='', FLASH='', PENDING=null;

/* ---------- scheduler: SM-2 style, exam-aware cap ---------- */
const STEPS=[1,10]; // learning steps, minutes
function capDays(){const d=daysTo(EXAM);return Math.max(1,Math.floor(d/2.5))}
function card(id){return S.cards[id]||(S.cards[id]={ivl:0,ease:2.5,step:0,due:0,reps:0,lapses:0,ok:0,bad:0,first:null,last:0})}
function schedule(id,grade){ // grade: 0 again, 1 hard, 2 good, 3 easy
  const c=card(id), now=Date.now(), cap=capDays();
  c.reps++; c.last=now; c.g=grade;
  const learning=c.ivl===0;
  if(grade===0){c.lapses+= learning?0:1; c.ease=Math.max(1.3,c.ease-0.2); c.ivl=0; c.step=0; c.due=now+STEPS[0]*6e4; return c}
  if(learning){
    if(grade===3){c.ivl=Math.min(cap,3)}
    else if(grade===1){c.due=now+STEPS[Math.min(c.step,1)]*6e4;return c}
    else if(c.step<STEPS.length-1){c.step++;c.due=now+STEPS[c.step]*6e4;return c}
    else c.ivl=1;
  }else{
    if(grade===1){c.ivl=c.ivl*1.2;c.ease=Math.max(1.3,c.ease-0.15)}
    else if(grade===2){c.ivl=c.ivl*c.ease}
    else {c.ivl=c.ivl*c.ease*1.3;c.ease+=0.15}
    c.ivl=Math.max(1,Math.round(c.ivl));
  }
  c.ivl=Math.min(c.ivl,cap);
  c.due=today()+c.ivl*DAY+4*36e5; // available from 4 AM on its due day
  return c;
}

/* ---------- stats ---------- */
const boosted=()=>DATA.k.filter(x=>S.boost&&S.boost[x.id]);
function pool(){return S.mode==='k'?DATA.k:S.mode==='q'?DATA.q.concat(boosted()):DATA.q.concat(DATA.k)}
function counts(){
  const now=Date.now(); let due=0,learn=0,mature=0,seen=0;
  for(const it of pool()){const c=S.cards[it.id]; if(!c)continue; seen++;
    if(c.due<=now+0) due++; if(c.ivl===0) learn++; if(c.ivl>=Math.min(7,capDays())) mature++;}
  return{due,learn,mature,seen,unseen:pool().length-seen,total:pool().length};
}
function newPerDay(){const un=DATA.q.filter(x=>!S.cards[x.id]).length+(S.mode!=='q'?DATA.k.filter(x=>!S.cards[x.id]).length:0);
  const d=Math.max(1,daysTo(FIRST_PASS)); return Math.min(80,Math.max(10,Math.ceil(un/d)))}
function newLeft(){if(S.newToday.d!==dkey(Date.now()))S.newToday={d:dkey(Date.now()),n:0};return Math.max(0,newPerDay()-S.newToday.n)}
function iaStats(){
  const m={}; for(const q of DATA.q){(m[q.ia]=m[q.ia]||{n:0,seen:0,ok:0,tries:0}).n++;
    const c=S.cards[q.id]; if(c&&(c.ok+c.bad)){m[q.ia].seen++; m[q.ia].ok+=c.cok||0; m[q.ia].tries+=c.ctr||0}}
  return Object.entries(m).map(([ia,v])=>({ia,...v,acc:v.tries?v.ok/v.tries:null})).sort((a,b)=>b.n-a.n);
}
function recentAcc(n=100){const L=S.log.filter(x=>x.t==='q'&&x.c).slice(-n); if(L.length<10)return null; return L.filter(x=>x.ok).length/L.length}
/* ---------- results and ratings ----------
   lr = last result, lok/lmiss = time of last right/miss, g = last rating (0 again … 3 easy).
   A missed card counts as fixed only once it is answered right on a later day than the miss:
   answering right minutes after seeing the answer is not yet evidence of retention. */

/* "Cold" answers (first try, or the first answer on a later day) measure readiness.

  if(cold){c.cok=(c.cok||0)+(ok?1:0); c.ctr=(c.ctr||0)+1}
  if(ok)c.lok=now; else{c.lmiss=now;c.g=0}
  if(S.boost)delete S.boost[id];

function migrate(){

    for(const[id,c]of Object.entries(S.cards)){if(!(c.ok+c.bad))continue; const t=tally[id];
      if(t){c.cok=t.ok;c.ctr=t.tr;c.seen=t.at} else {c.ctr=1;c.cok=c.first?1:0;c.seen=c.last||0}}

  else c.lr=c.ok>0||!c.bad}}

/* ---------- session building with weak-area weighting ---------- */
function buildSession(){
  const now=Date.now(), items=pool(), byId=Object.fromEntries(items.map(x=>[x.id,x]));
  const dueCards=items.filter(x=>S.cards[x.id]&&S.cards[x.id].due<=now).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const bt=items.filter(x=>!S.cards[x.id]&&S.boost&&S.boost[x.id]);
  const fresh=items.filter(x=>!S.cards[x.id]&&!(S.boost&&S.boost[x.id])); const nl=newLeft(); const picks=bt.slice();
  const st=Object.fromEntries(iaStats().map(x=>[x.ia,x]));
  const bucket={}; for(const x of fresh)(bucket[x.ia]=bucket[x.ia]||[]).push(x);
  for(const k in bucket)bucket[k].sort(()=>Math.random()-.5);
  while(picks.length<nl+bt.length){const keys=Object.keys(bucket).filter(k=>bucket[k].length); if(!keys.length)break;
    const w=keys.map(k=>{const a=st[k]&&st[k].acc!=null?st[k].acc:.6; return bucket[k].length*(1.25-a)});
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0; while(r>w[i]){r-=w[i];i++} picks.push(bucket[keys[i]].pop())}
  const q=[]; let di=0,ni=0; // interleave: 2 reviews : 1 new
  while(di<dueCards.length||ni<picks.length){ if(di<dueCards.length)q.push(dueCards[di++]); if(di<dueCards.length)q.push(dueCards[di++]); if(ni<picks.length)q.push(picks[ni++]); }
  return{queue:q,byId,done:0,right:0,newSeen:0,start:now,boosted:Object.fromEntries(bt.map(x=>[x.id,1]))};
}

function rateRow(it,again,isQ){
  const c=card(it.id), learning=c.ivl===0, cap=capDays();

    const iv=Math.min(cap,Math.max(1,Math.round(g===1?c.ivl*1.2:g===2?c.ivl*c.ease:c.ivl*c.ease*1.3))); return iv===1?'tomorrow':iv+' days'};

function why(it){const o=it.o[it.a].replace(/[.?!]$/,''),r=it.r;return r.toLowerCase().startsWith(o.toLowerCase())?r.slice(o.length).replace(/^[.?!]?\s*/,''):r}

function feedback(it,i,p){

function grade(it,g,ok){

   scrambled IDs, and the roster turns them back into students on the advisor's computer. */
const RKEY='abdeca-study-roster';
let DASH=null;
function loadRoster(){try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){return[]}}
function saveRoster(r){try{localStorage.setItem(RKEY,JSON.stringify(r))}catch(e){}}
async function parseRoster(text){const out=[], seen=new Set();
  const cells=line=>{if(line.includes('\t'))return line.split('\t'); const o=[]; let cur='',q=false;
    for(const ch of line){if(ch==='"')q=!q; else if((ch===','||ch===';')&&!q){o.push(cur);cur=''} else cur+=ch} o.push(cur); return o};
  for(const line of String(text).split(/\r?\n/)){const parts=cells(line).map(x=>x.trim().replace(/^"|"$/g,'').trim()).filter(Boolean);
    const em=parts.find(x=>/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(x)); if(!em)continue; const e=em.toLowerCase(); if(seen.has(e))continue; seen.add(e);
    out.push({name:parts.filter(x=>x!==em).join(' ').replace(/\s+/g,' ')||e.split('@')[0],email:e,sid:await sidFor(e)})}
  return out}
const daysAgo=t=>t?Math.max(0,Math.round((today()-sod(t))/DAY)):null;
const lastTxt=t=>{const d=daysAgo(t); return d==null?'Never':d===0?'Today':d===1?'Yesterday':d<7?d+' days ago':fmt(t)};
function wk(sum){let n=0; if(sum&&sum.recent)for(let i=0;i<7;i++)n+=sum.recent[dkey(today()-i*DAY+12*36e5)]||0; return n}
function mkRow(name,email,sid,s,unrostered){const cl=(s&&s.cluster)||'', sum=(s&&s.sum&&s.sum[cl])||null, last=(sum&&sum.last)||0, d=daysAgo(last);
  return{name:name||'Not on roster ('+sid.slice(0,6)+')',email,sid,acct:!!s,unrostered:!!unrostered,cl,
    acc:sum&&sum.acc!=null?sum.acc:null,seen:sum?sum.seen:null,total:sum?sum.total:null,missed:sum?sum.missed:null,
    last,lastD:d,wk:wk(sum),days:sum?sum.days:null,streak:sum&&d!=null&&d<=1?sum.streak:0,timed:sum?sum.timed:null,mock:sum?sum.mock:null,
    weak:sum&&sum.weak&&sum.weak[0]?sum.weak[0].ia+' ('+sum.weak[0].acc+'%)':'',
    other:s&&s.sum?Object.keys(s.sum).filter(k=>k!==cl).map(cname):[]}}
function dashRows(){const roster=loadRoster(), by={}, used=new Set(), rows=[];
  for(const s of DASH.list)by[s.sid]=s;
  for(const r of roster){used.add(r.sid); rows.push(mkRow(r.name,r.email,r.sid,by[r.sid]))}
  for(const s of DASH.list)if(!used.has(s.sid))rows.push(mkRow('','',s.sid,s,roster.length>0));
  return{rows,roster}}
const DCOLS=[['name','Student'],['cl','Cluster'],['acc','Readiness'],['seen','Seen'],['missed','Missed'],['last','Last studied'],['wk','Cards, 7 days'],['days','Days studied'],['streak','Streak'],['timed','Timed set'],['mock','Mock exam'],['weak','Weakest area']];

    else if(location.hash==='#advisor'&&ADV)advisor()}
  catch(e){console.error('Study Lab load error',e);app.innerHTML='<div class="notice">The question set could not load. Check your connection and refresh the page.</div>'}}
function showWho(){if(P.cur&&me()){whoB.hidden=false;whoB.textContent=who()+(MODE==='cloud'?' · sign out':' · switch');sel.disabled=false}else{whoB.hidden=true;sel.disabled=true}}
whoB.onclick=async()=>{
  if(MODE==='cloud'&&CLOUD&&CLOUD.currentSid()){whoB.textContent='Saving…'; try{if(dirty)await push()}catch(e){} P.cur=''; saveProfile(); await CLOUD.signOut()}
  else{P.cur=''; saveProfile(); MODE='cloud'; signin()}};
sel.onchange=()=>{if(P.cur)loadCluster(sel.value)};
function waitCloud(){return new Promise(res=>{if(window.Cloud)return res(window.Cloud); const t=setTimeout(()=>res(window.Cloud||null),10000);
  addEventListener('cloud-ready',()=>{clearTimeout(t);res(window.Cloud)},{once:true}); addEventListener('cloud-fail',()=>{clearTimeout(t);res(null)},{once:true})})}
P=loadProfile();
let PMOVE=location.hash.startsWith('#move=')?decodeURIComponent(location.hash.slice(6)):'';
if(PMOVE)history.replaceState(null,'',location.pathname+location.search);
addEventListener('hashchange',()=>{if(location.hash.startsWith('#move='))location.reload()});
app.innerHTML='<p class="muted">Loading…</p>';
waitCloud().then(c=>{
  if(!c){MODE='local'; if(P.cur&&me()){showWho();loadCluster(me().cluster)}else signin(); return}
  CLOUD=c; let first=true;
  c.onUser(sid=>{const was=first; first=false;
    if(sid)bootUser(sid);
    else if(was&&P.cur&&me()&&me().local){MODE='local';showWho();loadCluster(me().cluster)}
    else signin()})});
})();
</script>
